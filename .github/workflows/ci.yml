name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate region data
        run: npm run validate
      - name: Generate types from schema
        run: npm run gen:types
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Advisory, and deliberately last: coverage numbers are a prompt for a
      # human to request a depth pass (docs/07 Phase 8), never a gate. It writes
      # to the job summary and `continue-on-error` guarantees the contract even
      # if the script itself breaks — a report can't be what turns CI red.
      - name: Coverage report (advisory)
        if: always()
        continue-on-error: true
        run: |
          {
            echo '## Data coverage'
            echo
            echo '```'
            npm run report --silent
            echo '```'
            echo
            echo '<details><summary>Review age — what a depth pass should take next</summary>'
            echo
            echo '```'
            npm run report --silent -- --stale
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
