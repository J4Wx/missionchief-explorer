name: Feature or idea
description: Something the app should do that it doesn't.
title: "[Idea] "
labels: ["enhancement", "app"]
body:
  - type: markdown
    attributes:
      value: |
        Dispatch Atlas describes the **real world** and maps it onto Mission Chief
        planning. Modelling in-game mechanics, storing player accounts, or tracking
        anything about real individuals is out of scope — see
        [01 — Vision & Scope](https://github.com/J4Wx/missionchief-explorer/blob/main/docs/01-vision-and-scope.md).

        Several likely ideas are already written up as candidate phases in
        [08 — Phase Proposals](https://github.com/J4Wx/missionchief-explorer/blob/main/docs/08-phase-proposals.md);
        if yours is one of them, say so here and describe what you'd actually use.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do today, and where the app gets in the way. Not the solution yet.
      placeholder: >
        I'm planning coverage across two counties and can only look at one region at a
        time, so I can't see which side of the line a station is closer to.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      multiple: true
      options:
        - Map and markers
        - Filters and search
        - Facility detail panel
        - Region picker
        - Mission Chief planning output (what to build, which vehicles)
        - Data schema or coverage
        - Accessibility
        - Something else
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Optional. Workarounds, or other tools that do this well.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you file
      options:
        - label: This doesn't require a backend, a login, or storing anything about players — the site is static by design.
          required: true
